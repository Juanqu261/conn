<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Conn Lab not built</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1214;
        --surface: #1e2529;
        --ink: #e9e6dc;
        --muted: #a3a69c;
        --stitch: #5e8c7a;
        --voltage: #c8ff3d;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        background: var(--bg);
        color: var(--ink);
        font: 16px/1.5 system-ui, sans-serif;
      }
      main {
        max-width: 36rem;
        padding: 24px;
        background: var(--surface);
        border: 2px dashed var(--stitch);
        border-radius: 12px;
      }
      h1 {
        margin-top: 0;
        font-size: 1.375rem;
      }
      h1 span {
        color: var(--voltage);
      }
      p {
        color: var(--muted);
      }
      code {
        display: block;
        overflow-x: auto;
        padding: 12px;
        background: var(--bg);
        border-radius: 8px;
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <main>
      <h1><span aria-hidden="true">⚡</span> The Lab is dark</h1>
      <p>
        This <code style="display: inline; padding: 0 4px">conn server</code> was built without
        Conn Lab. The API works as usual. To bring the Lab to life, build the web app and then
        rebuild Conn:
      </p>
      <code>pnpm --filter @conn/web build<br />go build -o conn.exe ./cmd/conn</code>
    </main>
  </body>
</html>
