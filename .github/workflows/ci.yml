name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The PostgreSQL test harness creates and drops a fresh database for
      # each persistence test. This job-only credential is not a secret.
      CONN_TEST_DATABASE_URL: postgres://conn:conn-ci-only@127.0.0.1:5432/conn?sslmode=disable

    services:
      postgres:
        image: postgres:18.7@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
        env:
          POSTGRES_USER: conn
          POSTGRES_PASSWORD: conn-ci-only
          POSTGRES_DB: conn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=conn --dbname=conn"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.21.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.4
          cache: true

      - name: Report toolchain versions
        run: |
          node --version
          pnpm --version
          go version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks and tests
        run: pnpm check
